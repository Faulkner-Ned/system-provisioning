---
- name: Check if Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary

- name: Get expected Helm version (major.minor)
  set_fact:
    helm_expected_version: "{{ helm_version.split('.')[0] + '.' + helm_version.split('.')[1] }}"

- name: Check Helm version
  shell: >
    if helm version --short >/dev/null 2>&1; then
      helm version --short 2>/dev/null | grep -oP 'v\K[0-9]+\.[0-9]+' || echo "not installed";
    else
      echo "not installed";
    fi
  register: helm_version_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set Helm installation needed fact
  set_fact:
    helm_needed: "{{ helm_version_check.stdout == 'not installed' or helm_version_check.stdout != helm_expected_version }}"

- name: Install Helm
  block:
    - name: Remove existing Helm if wrong version
      ansible.builtin.file:
        path: /usr/local/bin/helm
        state: absent
      become: yes
      when: helm_binary.stat.exists

    - name: Download and install Helm
      ansible.builtin.unarchive:
        src: https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz
        dest: /tmp
        remote_src: yes
        creates: /tmp/linux-amd64/helm
      become: yes

    - name: Move Helm binary to /usr/local/bin
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: yes
        mode: '0755'
      become: yes

    - name: Clean up Helm temporary files
      ansible.builtin.file:
        path: /tmp/linux-amd64
        state: absent
      become: yes
  when: helm_needed | bool
