---
- name: Get actual user home directory
  shell: "echo ${SUDO_USER:-$USER} | xargs -I {} getent passwd {} | cut -d: -f6"
  register: user_home_output
  changed_when: false

- name: Get actual username
  shell: "echo ${SUDO_USER:-$USER}"
  register: user_name_output
  changed_when: false

- name: Set user home directory fact
  set_fact:
    target_user_home: "{{ user_home_output.stdout }}"
    target_user: "{{ user_name_output.stdout }}"

- name: Install pipx packages via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise x pipx install {{ item }}'
  become_user: "{{ target_user }}"
  loop: "{{ mise_pipx_packages }}"
  when: mise_pipx_packages | length > 0
  failed_when: false

- name: Install npm global packages via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise x npm install -g {{ item }}'
  become_user: "{{ target_user }}"
  loop: "{{ mise_npm_packages }}"
  when: mise_npm_packages | length > 0
  failed_when: false

- name: Install go packages via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    export PATH="$HOME/go/bin:$PATH"
    CGO_ENABLED=1 go install {{ item }}'
  become_user: "{{ target_user }}"
  loop: "{{ mise_go_packages }}"
  when: mise_go_packages | length > 0
  failed_when: false