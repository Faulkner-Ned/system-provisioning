---
- name: Get actual user home directory
  shell: "echo ${SUDO_USER:-$USER} | xargs -I {} getent passwd {} | cut -d: -f6"
  register: user_home_output
  changed_when: false

- name: Get actual username
  shell: "echo ${SUDO_USER:-$USER}"
  register: user_name_output
  changed_when: false

- name: Set user home directory fact
  set_fact:
    target_user_home: "{{ user_home_output.stdout }}"
    target_user: "{{ user_name_output.stdout }}"

- name: Check if Go {{ golang_version }} is already installed via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise exec -- go@{{ golang_version }} -- go version 2>/dev/null'
  register: golang_version_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set Go installation needed fact
  set_fact:
    golang_needed: "{{ golang_version_check.rc != 0 }}"

- name: Install Go via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise install go@{{ golang_version }}'
  become_user: "{{ target_user }}"
  failed_when: false
  when: golang_needed | bool