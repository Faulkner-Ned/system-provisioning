---
- name: Get actual user home directory
  shell: "echo ${SUDO_USER:-$USER} | xargs -I {} getent passwd {} | cut -d: -f6"
  register: user_home_output
  changed_when: false

- name: Get actual username
  shell: "echo ${SUDO_USER:-$USER}"
  register: user_name_output
  changed_when: false

- name: Set user home directory fact
  set_fact:
    target_user_home: "{{ user_home_output.stdout }}"
    target_user: "{{ user_name_output.stdout }}"

- name: Check AWS CLI version
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise x awscli -- aws --version 2>/dev/null | grep -oP 'aws-cli/\K[0-9]+' || echo "not installed"'
  register: aws_version_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set AWS CLI installation needed fact
  set_fact:
    aws_needed: "{{ aws_version_check.stdout == 'not installed' }}"

- name: Install AWS CLI via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise install -g awscli'
  become_user: "{{ target_user }}"
  when: aws_needed
  failed_when: false