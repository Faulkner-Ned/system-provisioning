---
- name: Get actual user home directory
  shell: "echo ${SUDO_USER:-$USER} | xargs -I {} getent passwd {} | cut -d: -f6"
  register: user_home_output
  changed_when: false

- name: Get actual username
  shell: "echo ${SUDO_USER:-$USER}"
  register: user_name_output
  changed_when: false

- name: Set user home directory fact
  set_fact:
    target_user_home: "{{ user_home_output.stdout }}"
    target_user: "{{ user_name_output.stdout }}"

- name: Check Terraform version
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise exec -- terraform@{{ terraform_version }} -- terraform version 2>/dev/null | head -1 | grep -oP 'Terraform v\K[0-9]+\.[0-9]+' || echo "not installed"'
  register: terraform_version_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set Terraform installation needed fact
  set_fact:
    terraform_needed: "{{ terraform_version_check.stdout == 'not installed' }}"

- name: Install Terraform via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise install terraform@{{ terraform_version }}'
  become_user: "{{ target_user }}"
  when: terraform_needed
  failed_when: false