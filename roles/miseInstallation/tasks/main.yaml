---
- name: Check if mise is already installed
  command: which mise
  register: mise_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set mise installation needed fact
  set_fact:
    mise_needed: "{{ mise_check.rc != 0 }}"

- name: Install mise
  block:
    - name: Install prerequisites for apt
      ansible.builtin.apt:
        name:
          - curl
          - gpg
        state: present
        update_cache: yes
      become: yes

    - name: Add Mise GPG key
      ansible.builtin.get_url:
        url: https://mise.jdx.dev/gpg-key.pub
        dest: /etc/apt/keyrings/mise-archive-keyring.asc
        mode: '0644'
      become: yes

    - name: Add Mise repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.asc] https://mise.jdx.dev/deb stable main"
        state: present
      become: yes

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
      become: yes

    - name: Install mise
      ansible.builtin.apt:
        name: mise
        state: present
      become: yes

    - name: Create user-level mise activation script template
      ansible.builtin.copy:
        dest: /etc/profile.d/mise.sh
        content: |
          export PATH="$HOME/.local/share/mise/shims:$HOME/.local/bin:$PATH"
        mode: '0644'
      become: yes
  when: mise_needed | bool