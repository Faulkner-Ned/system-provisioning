---
- name: Get actual user home directory
  shell: "echo ${SUDO_USER:-$USER} | xargs -I {} getent passwd {} | cut -d: -f6"
  register: user_home_output
  changed_when: false

- name: Get actual username
  shell: "echo ${SUDO_USER:-$USER}"
  register: user_name_output
  changed_when: false

- name: Set user home directory fact
  set_fact:
    target_user_home: "{{ user_home_output.stdout }}"
    target_user: "{{ user_name_output.stdout }}"

- name: Get expected Docker version (k8s_version - 1 minor)
  set_fact:
    docker_expected_version: "{{ k8s_version.split('.')[0] + '.' + ((k8s_version.split('.')[1] | int) - 1) | string }}"

- name: Get expected kubectl version
  set_fact:
    kubectl_expected_version: "{{ k8s_version }}"

- name: Check Docker version
  shell: docker --version 2>/dev/null | grep -oP 'Docker version \K[0-9]+\.[0-9]+' || echo "not installed"
  register: docker_version_check
  changed_when: false
  failed_when: false

- name: Check kubectl version
  shell: "kubectl version --client --short 2>/dev/null | grep -oP 'Client Version: v\\K[0-9]+\\.[0-9]+' || echo 'not installed'"
  register: kubectl_version_check
  changed_when: false
  failed_when: false

- name: Set Docker installation needed fact
  set_fact:
    docker_needed: "{{ docker_version_check.stdout == 'not installed' or docker_version_check.stdout != docker_expected_version }}"

- name: Set kubectl installation needed fact
  set_fact:
    kubectl_needed: "{{ kubectl_version_check.stdout == 'not installed' or kubectl_version_check.stdout != kubectl_expected_version }}"

- name: Install Docker and Kubernetes
  block:
    - name: Install prerequisites for apt over HTTPS
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
      become: yes

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /usr/share/keyrings/docker-archive-keyring.gpg
      become: yes

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
      become: yes

    - name: Create Kubernetes keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      become: yes

    - name: Add Kubernetes GPG key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        mode: '0644'
      become: yes

    - name: Add Kubernetes repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
        state: present
      become: yes

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
      become: yes

    - name: Install Docker and Kubernetes packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - kubelet
          - kubeadm
          - kubectl
        state: present
      become: yes

    - name: Hold Kubernetes packages from automatic upgrades
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
      become: yes

    - name: Add current user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: yes
      become: yes

    - name: Configure kubectl bash completion
      ansible.builtin.lineinfile:
        path: "{{ target_user_home }}/.bashrc"
        line: "source <(kubectl completion bash)"
        create: yes
      become: no

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes
      become: yes
  when: docker_needed | bool or kubectl_needed | bool
