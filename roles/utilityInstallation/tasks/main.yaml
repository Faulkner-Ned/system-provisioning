---
- name: Get actual user home directory
  import_tasks: ../_common/tasks/user_lookup.yaml

- name: Check if chezmoi is already installed via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise x chezmoi -- chezmoi --version 2>/dev/null || echo "not installed"'
  register: chezmoi_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set chezmoi installation needed fact
  set_fact:
    chezmoi_needed: "{{ chezmoi_check.stdout == 'not installed' }}"

- name: Install chezmoi via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise install -g chezmoi'
  become_user: "{{ target_user }}"
  when: chezmoi_needed
  failed_when: false

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes
  become: yes

- name: Install utility packages
  ansible.builtin.apt:
    name:
      - wget
      - starship
      - tmux
      - tree
    state: present
  become: yes

- name: Clean apt cache
  ansible.builtin.apt:
    autoclean: yes
  become: yes
