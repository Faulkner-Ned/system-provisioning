---
- name: Get actual user home directory
  shell: "echo ${SUDO_USER:-$USER} | xargs -I {} getent passwd {} | cut -d: -f6"
  register: user_home_output
  changed_when: false

- name: Get actual username
  shell: "echo ${SUDO_USER:-$USER}"
  register: user_name_output
  changed_when: false

- name: Set user home directory fact
  set_fact:
    target_user_home: "{{ user_home_output.stdout }}"
    target_user: "{{ user_name_output.stdout }}"

- name: Check if Python {{ python_version }} is already installed via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise exec -- python@{{ python_version }} -- python --version 2>/dev/null'
  register: python_version_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set Python installation needed fact
  set_fact:
    python_needed: "{{ python_version_check.rc != 0 }}"

- name: Check if pipx is already installed via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise x pipx --help 2>/dev/null'
  register: pipx_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set pipx installation needed fact
  set_fact:
    pipx_needed: "{{ pipx_check.rc != 0 }}"

- name: Install Python and pipx via mise
  block:
    - name: Install Python {{ python_version }} via mise
      shell: |
        bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
        export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
        mise install python@{{ python_version }}'
      become_user: "{{ target_user }}"
      when: python_needed

    - name: Install pipx via mise
      shell: |
        bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
        export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
        mise install -g pipx'
      become_user: "{{ target_user }}"
      when: pipx_needed

    - name: Ensure pipx is in PATH
      shell: |
        bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
        source ~/.profile 2>/dev/null || true
        pipx ensurepath'
      become_user: "{{ target_user }}"
      when: pipx_needed
      changed_when: false
  when: python_needed | bool or pipx_needed | bool