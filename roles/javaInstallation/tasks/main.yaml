---
- name: Get actual user home directory
  shell: "echo ${SUDO_USER:-$USER} | xargs -I {} getent passwd {} | cut -d: -f6"
  register: user_home_output
  changed_when: false

- name: Get actual username
  shell: "echo ${SUDO_USER:-$USER}"
  register: user_name_output
  changed_when: false

- name: Set user home directory fact
  set_fact:
    target_user_home: "{{ user_home_output.stdout }}"
    target_user: "{{ user_name_output.stdout }}"

- name: Check if Java {{ java_version }} is already installed via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise exec -- java@{{ java_version }} -- java -version 2>/dev/null'
  register: java_version_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Check if Maven is already installed via mise
  shell: |
    bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
    export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
    mise x maven -- mvn --version 2>/dev/null'
  register: maven_check
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Set installation needed facts
  set_fact:
    java_needed: "{{ java_version_check.rc != 0 }}"
    maven_needed: "{{ maven_check.rc != 0 }}"

- name: Install Java and Maven via mise
  block:
    - name: Install Java {{ java_version }} via mise
      shell: |
        bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
        export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
        mise install java@{{ java_version }}'
      become_user: "{{ target_user }}"
      when: java_needed
      failed_when: false

    - name: Install Maven via mise
      shell: |
        bash -c 'source /etc/profile.d/mise.sh 2>/dev/null || true
        export MISE_DATA_DIR="{{ target_user_home }}/.local/share/mise"
        mise install -g maven'
      become_user: "{{ target_user }}"
      when: maven_needed
      failed_when: false
  when: java_needed | bool or maven_needed | bool