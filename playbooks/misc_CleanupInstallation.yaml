---
- name: Remove installed software for fresh reinstall
  hosts: local
  become: yes
  tasks:
    - name: Remove Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - docker
        state: absent
        purge: yes

    - name: Remove Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: absent
        purge: yes

    - name: Remove Helm binary
      ansible.builtin.file:
        path: /usr/local/bin/helm
        state: absent

    - name: Remove AWS CLI
      ansible.builtin.file:
        path: /usr/local/bin/aws
        state: absent
      ignore_errors: yes

    - name: Remove AWS CLI installation directory
      ansible.builtin.file:
        path: /usr/local/aws-cli
        state: absent
      ignore_errors: yes

    - name: Remove Terraform
      ansible.builtin.apt:
        name: terraform
        state: absent
        purge: yes

    - name: Remove kubectx
      ansible.builtin.apt:
        name: kubectx
        state: absent
        purge: yes

    - name: Remove HashiCorp repository
      ansible.builtin.apt_repository:
        repo: deb https://apt.releases.hashicorp.com "{{ ansible_distribution_release }}" main
        state: absent

    - name: Remove Kubernetes repository
      ansible.builtin.apt_repository:
        repo: deb https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /
        state: absent

    - name: Remove Docker repository
      ansible.builtin.apt_repository:
        repo: deb https://download.docker.com/linux/debian "{{ ansible_distribution_release }}" stable
        state: absent

    - name: Remove GPG keys
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/share/keyrings/docker-archive-keyring.gpg
        - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Remove utility packages
      ansible.builtin.apt:
        name:
          - chezmoi
          - wget
          - starship
          - tmux
          - tree
        state: absent
        purge: yes

    - name: Remove VSCode
      ansible.builtin.apt:
        name: code
        state: absent
        purge: yes

    - name: Remove VSCode repository
      ansible.builtin.apt_repository:
        repo: deb https://packages.microsoft.com/repos/vscode stable main
        state: absent

    - name: Remove Spotify
      ansible.builtin.apt:
        name: spotify-client
        state: absent
        purge: yes

    - name: Remove Spotify repository
      ansible.builtin.apt_repository:
        repo: deb https://repository.spotify.com stable non-free
        state: absent

    - name: Remove Mullvad
      ansible.builtin.apt:
        name: mullvad-vpn
        state: absent
        purge: yes

    - name: Remove Mullvad repository
      ansible.builtin.apt_repository:
        repo: deb https://repository.mullvad.net/deb/stable stable main
        state: absent

    - name: Remove Ghostly
      ansible.builtin.apt:
        name: ghostly
        state: absent
        purge: yes

    - name: Remove Ghostly repository
      ansible.builtin.apt_repository:
        repo: deb https://debian.griffo.io/apt "{{ codename }}" main
        state: absent

    - name: Remove Discord
      ansible.builtin.apt:
        name: discord
        state: absent
        purge: yes

    - name: Remove Bitwarden
      ansible.builtin.apt:
        name: bitwarden
        state: absent
        purge: yes

    - name: Remove Microsoft GPG key
      ansible.builtin.file:
        path: /usr/share/keyrings/microsoft.asc
        state: absent

    - name: Remove Mullvad GPG key
      ansible.builtin.file:
        path: /usr/share/keyrings/mullvad-keyring.asc
        state: absent

    - name: Remove Spotify GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/spotify.gpg
        state: absent

    - name: Remove Ghostly GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings/ghostly.gpg
        state: absent

    - name: Remove Java and Maven
      ansible.builtin.apt:
        name:
          - openjdk-21-jre
          - maven
        state: absent
        purge: yes

    - name: Remove pipx
      ansible.builtin.apt:
        name: pipx
        state: absent
        purge: yes

    - name: Remove user-installed Go packages
      ansible.builtin.shell: |
        su - {{ ansible_user_id }} -c 'go clean -cache' 2>/dev/null || true
      ignore_errors: yes

    - name: Remove pyenv and Python versions
      ansible.builtin.shell: |
        rm -rf ~/.pyenv
        rm -rf ~/.local/go
        rm -rf ~/.nvm
        rm -rf ~/go
      ignore_errors: yes

    - name: Remove Docker group from user
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: no
      ignore_errors: yes

    - name: Clean apt cache
      ansible.builtin.apt:
        autoremove: yes
        autoclean: yes
        purge: yes
